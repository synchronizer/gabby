<!DOCTYPE html>
<html lang="ru" style="color-scheme: dark;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gabby — Test</title>
</head>

<body>
    <style>
        .gabby {
            width: min(20rem, 100%);
            padding: 1.5rem;
            border-radius: 1rem;
            display: grid;
            gap: 1rem;
            box-shadow: 0 0 0 2px canvasText;
            background-color: canvas;
        }

        .gabby__input,
        .gabby__button {
            box-shadow: 0 0 0 2px canvasText;
            background-color: canvas;
            border-radius: .5rem;
            height: 3rem;
            border: none;
            padding-inline: 1rem;
            padding-block: .5rem;
            box-sizing: border-box;
            resize: vertical;
        }

        .gabby__button {
            box-shadow: none;
            background-color: canvastext;
            color: canvas;
            font-size: 1rem;
            font-family: monospace;
        }
    </style>
    <form class="gabby" data-gabby-id="ff_06oqgh88">

        <input required type="text" class="gabby__input" data-gabby="👤 Имя" placeholder="Имя" value="Василий">
        <input required type="text" class="gabby__input" data-gabby="☎️ Телефон" placeholder="Телефон"
            value="+7 906 073-51-31">

        <!-- Gabby service field. Do not remove. -->
        <input
            type="text"
            class="gabby__input"
            data-gabby="gabby_extra"
            tabindex="-1"
            autocomplete="off"
            aria-hidden="true"
            style="position:absolute; left:-9999px;"
        >
        <button class="gabby__button" type="submit">
            Отправить
        </button>

    </form>

    <script src="./client/gabby.js" data-gabby-api="http://localhost:3000"></script>
    <!-- <script src="https://gabby-cdn.onrender.com/gabby.js"></script> -->

    <script>
        const form = document.querySelector('[data-gabby-id]')
        const button = form.querySelector('button[type="submit"]')

        form.addEventListener('gabby:submit:start', () => {
            button.disabled = true
            button.textContent = 'Отправляем…'
        })

        form.addEventListener('gabby:submit:success', () => {
            button.textContent = 'Отправлено ✓'
        })

        form.addEventListener('gabby:submit:error', () => {
            button.disabled = false
            button.textContent = 'Ошибка. Повторить'
        })
    </script>

</body>

</html>
